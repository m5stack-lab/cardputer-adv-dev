; PlatformIO has no dedicated "cardputer" board entry, so this builds on the
; generic ESP32-S3 devkit board and overrides flash/USB settings for the
; Cardputer ADV's ESP32-S3FN8 module (8MB flash, no PSRAM). Confirm against
; `tools/device.py info` before changing flash_size.
[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default.csv

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    m5stack/M5Cardputer @ ^1.0.2
